<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analytics · HireSense AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236755DC'/><text x='50' y='68' font-size='48' font-weight='800' fill='white' text-anchor='middle' font-family='sans-serif'>HS</text></svg>" />
  <script src="/js/theme.js"></script>
  <script src="/js/tailwind.js"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/custom.css" />
</head>
<body class="bg-background font-body text-on-surface-variant antialiased">
  <div data-page-content>
    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h1 class="font-headline-lg text-headline-lg text-on-surface">Analytics</h1>
        <p class="mt-1 text-body-md text-on-surface-variant">Real numbers computed from your own recruitment records.</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <label class="flex items-center gap-2 text-body-md text-on-surface-variant">
          From
          <input type="date" id="date-from"
                 class="rounded-lg border border-outline-variant bg-surface-container-lowest px-3 py-2 text-body-md text-on-surface focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" />
        </label>
        <label class="flex items-center gap-2 text-body-md text-on-surface-variant">
          To
          <input type="date" id="date-to"
                 class="rounded-lg border border-outline-variant bg-surface-container-lowest px-3 py-2 text-body-md text-on-surface focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" />
        </label>
        <button id="apply-filters" type="button"
                class="inline-flex items-center gap-2 rounded-lg bg-primary-container px-4 py-2 text-body-md font-semibold text-on-primary shadow-sm hover:bg-primary">
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">filter_alt</span> Apply
        </button>
      </div>
    </div>

    <!-- Summary metrics -->
    <div id="summary-metrics" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4"></div>

    <!-- Charts row 1 -->
    <div class="grid gap-5 lg:grid-cols-5">
      <section class="rounded-xl border border-outline-variant bg-surface-container-lowest p-5 shadow-sm lg:col-span-3" aria-labelledby="trend-title">
        <h2 id="trend-title" class="font-headline-sm text-headline-sm text-on-surface">Applications over time</h2>
        <div id="trend-chart" class="mt-4"></div>
      </section>
      <section class="rounded-xl border border-outline-variant bg-surface-container-lowest p-5 shadow-sm lg:col-span-2" aria-labelledby="dist-title">
        <h2 id="dist-title" class="font-headline-sm text-headline-sm text-on-surface">Status distribution</h2>
        <div id="status-chart" class="mt-4"></div>
      </section>
    </div>

    <!-- Charts row 2 -->
    <div class="grid gap-5 lg:grid-cols-2">
      <section class="rounded-xl border border-outline-variant bg-surface-container-lowest p-5 shadow-sm" aria-labelledby="jobs-title">
        <h2 id="jobs-title" class="font-headline-sm text-headline-sm text-on-surface">Applications by job</h2>
        <div id="jobs-chart" class="mt-4"></div>
      </section>
      <section class="rounded-xl border border-outline-variant bg-surface-container-lowest p-5 shadow-sm" aria-labelledby="skills-title">
        <h2 id="skills-title" class="font-headline-sm text-headline-sm text-on-surface">Top skills across resumes</h2>
        <p class="mt-1 text-body-sm text-on-surface-variant">How often each required skill appears in submitted resumes.</p>
        <div id="skills-chart" class="mt-4"></div>
      </section>
    </div>
  </div>

  <script type="module" src="/js/pages/analytics.js"></script>
</body>
</html>
