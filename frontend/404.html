<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found · HireSense AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236755DC'/><text x='50' y='68' font-size='48' font-weight='800' fill='white' text-anchor='middle' font-family='sans-serif'>HS</text></svg>" />
  <script src="/js/theme.js"></script>
  <script src="/js/tailwind.js"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/custom.css" />
</head>
<body class="bg-background font-body text-on-surface-variant antialiased">
  <div data-public-nav></div>

  <main class="mx-auto flex max-w-2xl flex-col items-center px-4 py-24 text-center sm:px-6 lg:px-8">
    <div class="relative">
      <p class="font-headline-lg text-[7rem] font-extrabold leading-none text-primary/10 select-none" aria-hidden="true">404</p>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="flex h-20 w-20 items-center justify-center rounded-full bg-primary-fixed text-on-primary-fixed-variant">
          <span class="material-symbols-outlined text-[36px]" aria-hidden="true">search_off</span>
        </div>
      </div>
    </div>

    <h1 class="mt-6 font-headline-md text-headline-md text-on-surface sm:text-headline-lg">Page not found</h1>
    <p class="mt-3 max-w-md text-body-md leading-6 text-on-surface-variant">
      The page you are looking for does not exist, may have been moved, or the
      link may be out of date.
    </p>

    <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
      <a href="/"
         class="inline-flex items-center justify-center gap-2 rounded-lg bg-primary-container px-6 py-3 text-body-md font-semibold text-on-primary shadow-sm hover:bg-primary">
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">home</span>
        Return Home
      </a>
      <a href="/careers"
         class="inline-flex items-center justify-center gap-2 rounded-lg border border-outline-variant bg-surface-container-lowest px-6 py-3 text-body-md font-semibold text-on-surface hover:bg-surface-container-low">
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">work</span>
        Go to Careers
      </a>
    </div>
  </main>

  <div data-public-footer></div>
  <script type="module">
    import { mountPublicNav, mountPublicFooter } from "/js/layout.js";
    mountPublicNav({});
    mountPublicFooter();
  </script>
</body>
</html>
