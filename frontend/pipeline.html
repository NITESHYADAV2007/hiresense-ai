<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pipeline · HireSense AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236755DC'/><text x='50' y='68' font-size='48' font-weight='800' fill='white' text-anchor='middle' font-family='sans-serif'>HS</text></svg>" />
  <script src="/js/theme.js"></script>
  <script src="/js/tailwind.js"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/custom.css" />
</head>
<body class="bg-background font-body text-on-surface-variant antialiased">
  <div data-page-content>
    <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
      <div>
        <h1 class="font-headline-lg text-headline-lg text-on-surface">Pipeline</h1>
        <p class="mt-1 text-body-md text-on-surface-variant">Drag candidates between stages, or use the stage dropdown on each card.</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <a href="/candidates"
           class="inline-flex items-center gap-2 rounded-lg border border-outline-variant bg-surface-container-lowest px-4 py-2.5 text-body-md font-semibold text-on-surface hover:bg-surface-container-low">
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">table_rows</span> List view
        </a>
        <select id="job-filter"
                class="rounded-lg border border-outline-variant bg-surface-container-lowest px-3 py-2.5 text-body-md text-on-surface focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary">
          <option value="">All jobs</option>
        </select>
        <button id="refresh-btn" type="button"
                class="rounded-lg border border-outline-variant bg-surface-container-lowest p-2.5 text-on-surface-variant hover:bg-surface-container-low"
                aria-label="Refresh pipeline">
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">refresh</span>
        </button>
      </div>
    </div>

    <div id="board" class="thin-scroll -mx-4 overflow-x-auto px-4 pb-4 sm:mx-0 sm:px-0">
      <div class="flex min-w-max gap-4"></div>
    </div>
  </div>

  <script type="module" src="/js/pages/pipeline.js"></script>
</body>
</html>
