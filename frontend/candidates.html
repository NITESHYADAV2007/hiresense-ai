<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Candidates · HireSense AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236755DC'/><text x='50' y='68' font-size='48' font-weight='800' fill='white' text-anchor='middle' font-family='sans-serif'>HS</text></svg>" />
  <script src="/js/theme.js"></script>
  <script src="/js/tailwind.js"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/custom.css" />
</head>
<body class="bg-background font-body text-on-surface-variant antialiased">
  <div data-page-content>
    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h1 class="font-headline-lg text-headline-lg text-on-surface">Candidates</h1>
        <p class="mt-1 text-body-md text-on-surface-variant"><span id="total-count">…</span> applications across all jobs</p>
      </div>
      <div class="flex items-center gap-2">
        <a href="/pipeline"
           class="inline-flex items-center gap-2 rounded-lg border border-outline-variant bg-surface-container-lowest px-4 py-2.5 text-body-md font-semibold text-on-surface hover:bg-surface-container-low">
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">view_kanban</span> Pipeline
        </a>
        <button id="export-btn" type="button"
           class="inline-flex items-center gap-2 rounded-lg bg-primary-container px-4 py-2.5 text-body-md font-semibold text-on-primary shadow-sm hover:bg-primary">
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">download</span> Export CSV
        </button>
      </div>
    </div>

    <!-- Filters -->
    <form id="filters" class="rounded-xl border border-outline-variant bg-surface-container-lowest p-4 shadow-sm">
      <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-5">
        <div class="relative lg:col-span-2">
          <span class="material-symbols-outlined pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-on-surface-variant" aria-hidden="true">search</span>
          <input type="search" name="search" placeholder="Search name, email, or job…"
                 class="w-full rounded-lg border border-outline-variant bg-surface-container-lowest py-2.5 pl-10 pr-3 text-body-md text-on-surface placeholder:text-on-surface-variant/60 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" />
        </div>
        <select name="job_id"
                class="rounded-lg border border-outline-variant bg-surface-container-lowest px-3 py-2.5 text-body-md text-on-surface focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary">
          <option value="">All jobs</option>
        </select>
        <select name="status"
                class="rounded-lg border border-outline-variant bg-surface-container-lowest px-3 py-2.5 text-body-md text-on-surface focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary">
          <option value="">All statuses</option>
          <option>Applied</option>
          <option>Under Review</option>
          <option>Shortlisted</option>
          <option>Interview</option>
          <option>Hired</option>
          <option>Rejected</option>
        </select>
        <select name="sort"
                class="rounded-lg border border-outline-variant bg-surface-container-lowest px-3 py-2.5 text-body-md text-on-surface focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="score_desc">Highest match</option>
          <option value="score_asc">Lowest match</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
    </form>

    <!-- Table -->
    <section class="rounded-xl border border-outline-variant bg-surface-container-lowest shadow-sm" aria-labelledby="table-title">
      <h2 id="table-title" class="sr-only">Applications list</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-body-md">
          <thead class="border-b border-outline-variant bg-surface-container-low text-label-md uppercase tracking-wide text-on-surface-variant">
            <tr>
              <th scope="col" class="px-5 py-3">Candidate</th>
              <th scope="col" class="px-5 py-3">Job</th>
              <th scope="col" class="px-5 py-3">Match</th>
              <th scope="col" class="px-5 py-3">Status</th>
              <th scope="col" class="px-5 py-3">Applied</th>
              <th scope="col" class="px-5 py-3 text-right">Action</th>
            </tr>
          </thead>
          <tbody id="apps-body" class="divide-y divide-outline-variant"></tbody>
        </table>
      </div>
      <div id="pagination" class="px-5 pb-5"></div>
    </section>
  </div>

  <script type="module" src="/js/pages/candidates.js"></script>
</body>
</html>
